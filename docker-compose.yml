services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jpeclearner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jpeclearner}
      POSTGRES_DB: ${POSTGRES_DB:-jpeclearner}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jpeclearner}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - images_data:/data/images
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://jpeclearner:jpeclearner@db:5432/jpeclearner}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-change-me}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-20160}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-30}
      IMAGE_STORAGE_PATH: ${IMAGE_STORAGE_PATH:-/data/images}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      OCR_SERVICE_URL: ${OCR_SERVICE_URL:-http://ocr:8090}
      OCR_TEMP_MAX_AGE_MINUTES: ${OCR_TEMP_MAX_AGE_MINUTES:-60}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-jpeclearner-ocr-scans}
    depends_on:
      db:
        condition: service_healthy
      ocr:
        condition: service_started

  ocr:
    build:
      context: ./ocr_service
    restart: unless-stopped
    # Deliberately capped: this runs on a memory/CPU-constrained VPS, not a
    # workstation, so the lightweight PP-OCR/PP-FormulaNet + manga-ocr models
    # (see ocr_service/main.py) are chosen to fit well under this -- measured
    # ~1.3-1.6GB working set across both models plus a real inference request
    # in each mode. Raise it if you size up the models later; it exists so a
    # runaway OCR request can't take down Postgres/backend on the same box.
    mem_limit: 2000m
    volumes:
      # manga-ocr's weights (via Hugging Face transformers) live under
      # ~/.cache/huggingface; PP-StructureV3's own pipeline models (PP-OCRv5,
      # PP-FormulaNet, PP-DocLayout) are cached under ~/.paddlex instead --
      # both need to persist across restarts so models aren't re-downloaded
      # every time the container recreates.
      - ocr_hf_cache:/root/.cache/huggingface
      - ocr_paddlex_cache:/root/.paddlex

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}

  adminer:
    image: adminer:latest
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  pgdata:
  images_data:
  frontend_node_modules:
  ocr_hf_cache:
  ocr_paddlex_cache:
