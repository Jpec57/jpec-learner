# Production stack (used by deploy.sh):
#
#   docker compose -f docker-compose.prod.yml --env-file .env --env-file .env.local up -d --build
#
# Every published port is bound to 127.0.0.1. The only public entry point is
# the host nginx (deploy/nginx/learn.enter-train-me.fr.conf), which proxies
# /api/ and /media/ to the backend and everything else to the frontend.
# docker-compose.yml remains the development setup.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jpeclearner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jpeclearner}
      POSTGRES_DB: ${POSTGRES_DB:-jpeclearner}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jpeclearner}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - images_data:/data/images
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://jpeclearner:jpeclearner@db:5432/jpeclearner}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-change-me}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-20160}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-30}
      IMAGE_STORAGE_PATH: ${IMAGE_STORAGE_PATH:-/data/images}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      OCR_SERVICE_URL: ${OCR_SERVICE_URL:-http://ocr:8090}
      OCR_TEMP_MAX_AGE_MINUTES: ${OCR_TEMP_MAX_AGE_MINUTES:-60}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-jpeclearner-ocr-scans}
    depends_on:
      db:
        condition: service_healthy
      ocr:
        condition: service_started

  ocr:
    build:
      context: ./ocr_service
    restart: unless-stopped
    # Same cap as docker-compose.yml (see the note there): keeps a runaway OCR
    # request from taking down Postgres/backend on this shared box.
    mem_limit: 2000m
    volumes:
      - ocr_hf_cache:/root/.cache/huggingface
      - ocr_paddlex_cache:/root/.paddlex

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the bundle at build time; must be the public URL, set in
        # .env.local (https://learn.enter-train-me.fr/api/v1).
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:80"

  adminer:
    image: adminer:latest
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  pgdata:
  images_data:
  ocr_hf_cache:
  ocr_paddlex_cache:
