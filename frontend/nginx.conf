server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Never cache the entry point or the PWA service worker files, otherwise
    # clients keep running an old build after a deploy.
    location ~* ^/(index\.html|sw\.js|registerSW\.js|manifest\.webmanifest|push-handlers\.js)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Content-hashed build output: safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
