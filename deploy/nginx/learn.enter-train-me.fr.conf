# Host nginx site for JpecLearner. deploy.sh symlinks this file into
# /etc/nginx/sites-enabled/, runs `nginx -t` and reloads. To do it by hand:
#
#   ln -s /root/jpeclearner/deploy/nginx/learn.enter-train-me.fr.conf /etc/nginx/sites-enabled/learn.enter-train-me.fr
#   nginx -t && systemctl reload nginx
#
# Same TLS setup as the other enter-train-me.fr sites: Cloudflare proxies the
# domain and talks to this origin with the Cloudflare origin certificate.

server {
    listen 80;
    server_name learn.enter-train-me.fr;

    # Redirect HTTP to HTTPS only if the original request is not already HTTPS
    if ($http_x_forwarded_proto != "https") {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name learn.enter-train-me.fr;

    ssl_certificate /etc/ssl/certs/cloudflare.crt;
    ssl_certificate_key /etc/ssl/private/cloudflare.key;

    # OCR photo uploads.
    client_max_body_size 20m;

    # Backend (FastAPI, docker-compose.prod.yml -> 127.0.0.1:8000).
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # OCR scans can be slow on this CPU-only box (Cloudflare itself cuts
        # proxied requests at 100s regardless).
        proxy_read_timeout 120s;
    }

    # Uploaded card images, served by the backend.
    location /media/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Frontend (static bundle in an nginx container -> 127.0.0.1:5173).
    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
